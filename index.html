<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dles</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#F1ECFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1830" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="dles">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{ --bg:#F1ECFF; --card:#FFFFFF; --ink:#2E2A4F; --muted:#6B6790; --accent:#6656E0; --icon:#E3F1FF;
  --blob1:#FFE3EE; --blob2:#DDF4E9; --shadow:0 14px 34px rgba(90,64,190,.16); color-scheme:light }
@media (prefers-color-scheme:dark){ :root{ --bg:#1B1830; --card:#28233F; --ink:#EEEAFB; --muted:#A9A3C9; --accent:#9A8FFF; --icon:#2E3F66;
  --blob1:#2E2045; --blob2:#1E2E36; --shadow:0 14px 34px rgba(0,0,0,.35); color-scheme:dark } }
body{margin:0; min-height:100vh; background:radial-gradient(circle at 88% 6%,var(--blob1) 0 90px,transparent 91px),radial-gradient(circle at 4% 28%,var(--blob2) 0 60px,transparent 61px),var(--bg);
  color:var(--ink); font-family:"Nunito",system-ui,sans-serif; font-weight:600; line-height:1.4}
main{max-width:560px; margin:0 auto; padding:64px 20px}
h1{margin:0 0 28px; font:800 4rem/1 "Baloo 2",system-ui,sans-serif; letter-spacing:-.01em}
ul{list-style:none; margin:0; padding:0; display:grid; gap:14px}
a{display:flex; align-items:center; gap:16px; padding:18px; background:var(--card); border-radius:30px; box-shadow:var(--shadow); color:inherit; text-decoration:none; transition:transform .15s ease}
a:hover{transform:translateY(-2px)}
a:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
.icon{width:64px; height:64px; flex:none; border-radius:22px; background:var(--icon); display:flex; align-items:center; justify-content:center}
.text{flex:1; min-width:0}
b{display:block; font:700 1.45rem/1.2 "Baloo 2",system-ui,sans-serif}
span{display:block; color:var(--muted); font-size:.95rem; font-weight:700}
.chev{flex:none}
@media (prefers-reduced-motion:reduce){ a{transition:none} a:hover{transform:none} }
</style>
</head>
<body>
<main>
  <h1>dles</h1>
  <ul>
    <li><a href="mind-the-map/"><div class="icon"><svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><path d="M2 28C12 26 18 30 24 22S36 12 42 14" fill="none" stroke="#FF7F8E" stroke-width="5.5" stroke-linecap="round"/><path d="M14 2C16 14 20 18 24 22S30 36 28 42" fill="none" stroke="#5BB8F5" stroke-width="5.5" stroke-linecap="round"/><circle cx="24" cy="22" r="5.5" fill="#fff" stroke="#2E2A4F" stroke-width="2.5"/></svg></div><div class="text"><b>Mind the Map</b><span>Daily Tube station game</span></div><svg class="chev" width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a></li>
  </ul>
</main>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
