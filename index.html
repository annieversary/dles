<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{ --bg:#E4EAEF; --card:#FFFFFF; --ink:#15212C; --muted:#5B6975; --edge:#CCD5DC; color-scheme:light }
@media (prefers-color-scheme:dark){ :root{ --bg:#0E1A23; --card:#1A2A36; --ink:#E8EEF2; --muted:#93A3AF; --edge:#2B3E4C; color-scheme:dark } }
body{margin:0; background:var(--bg); color:var(--ink); font-family:"Archivo",system-ui,sans-serif; line-height:1.4}
main{max-width:560px; margin:0 auto; padding:48px 16px}
h1{margin:0 0 24px; font-size:2rem; font-weight:800; font-stretch:112%; letter-spacing:-.01em}
ul{list-style:none; margin:0; padding:0; display:grid; gap:10px}
a{display:block; padding:14px 16px; background:var(--card); border:1px solid var(--edge); border-radius:10px; color:inherit; text-decoration:none}
a:hover{border-color:var(--ink)}
b{font-weight:700; font-stretch:108%}
span{display:block; color:var(--muted); font-size:.9rem}
</style>
</head>
<body>
<main>
  <h1>dles</h1>
  <ul>
    <li><a href="mind-the-map/"><b>Mind the Map</b><span>Daily Tube station game</span></a></li>
  </ul>
</main>
</body>
</html>
