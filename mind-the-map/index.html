<style>
:root{
  --bg:#E4EAEF; --land:#F3F5F7; --river:#BCD4E3; --ink:#15212C; --muted:#5B6975;
  --card:#FFFFFF; --edge:#CCD5DC; --dot:#FFFFFF; --northern:#15212C;
  --good:#1E8A4C; --near:#C99A06; --mid:#D9661F; --far:#C2303A; --sel:#15212C;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0E1A23; --land:#15232E; --river:#1F3B50; --ink:#E8EEF2; --muted:#93A3AF;
  --card:#1A2A36; --edge:#2B3E4C; --dot:#15232E; --northern:#E8EEF2; --sel:#FFFFFF; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1A23; --land:#15232E; --river:#1F3B50; --ink:#E8EEF2; --muted:#93A3AF;
  --card:#1A2A36; --edge:#2B3E4C; --dot:#15232E; --northern:#E8EEF2; --sel:#FFFFFF; color-scheme:dark;
}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0; height:100%; background:var(--bg); color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:16px; line-height:1.4;
  display:flex; flex-direction:column; overflow:hidden; -webkit-tap-highlight-color:transparent}
header{display:flex; align-items:center; gap:12px; padding:10px 16px; max-width:1100px; width:100%; margin:0 auto}
h1{margin:0; font-size:1.25rem; font-weight:800; font-stretch:112%; letter-spacing:-.01em; white-space:nowrap}
h1 small{font-weight:500; font-stretch:100%; color:var(--muted); font-size:.85rem; margin-left:6px}
.tiles{display:flex; gap:5px; margin-left:auto}
.tile{width:14px; height:14px; border-radius:3px; background:var(--edge)}
.tile.cur{outline:2px solid var(--ink); outline-offset:1px}
.tile.g{background:var(--good)} .tile.y{background:var(--near)} .tile.o{background:var(--mid)} .tile.r{background:var(--far)}
.practice-count{margin-left:auto; color:var(--muted); font-size:.9rem}
#mapwrap{flex:1; position:relative; min-height:0; margin:0 auto; width:100%; max-width:1100px}
#map{position:absolute; inset:0; width:100%; height:100%; background:var(--land); touch-action:none; cursor:grab; display:block;
  border-radius:14px; outline:none}
#map.drag{cursor:grabbing}
#map-transition{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:hidden; border-radius:14px; background:var(--land)}
@media (max-width:1132px){ #map,#map-transition{border-radius:0} }
.zoom{position:absolute; right:12px; top:12px; display:flex; flex-direction:column; gap:6px}
.zoom button{width:40px; height:40px; border-radius:10px; border:1px solid var(--edge); background:var(--card); color:var(--ink);
  font:600 1.2rem/1 "Archivo",system-ui,sans-serif; cursor:pointer}
.zoom button.wide{font-size:.7rem; font-weight:700}
.hint-toast{position:absolute; left:12px; bottom:12px; background:var(--card); border:1px solid var(--edge); border-radius:10px; padding:6px 10px; font-size:.82rem; color:var(--muted); pointer-events:none; transition:opacity .4s}
#card{background:var(--card); border-top:1px solid var(--edge); padding:14px 16px 16px}
.inner{max-width:720px; margin:0 auto}
.find{color:var(--muted); font-size:.9rem; margin:0}
.station{margin:2px 0 10px; font-size:clamp(1.7rem,6vw,2.6rem); font-weight:800; font-stretch:80%; line-height:1.02; letter-spacing:-.01em}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
button.btn{appearance:none; border:0; border-radius:12px; padding:12px 18px; font:700 1rem/1 "Archivo",system-ui,sans-serif; cursor:pointer;
  background:var(--ink); color:var(--card); min-height:46px}
button.btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--edge)}
button.btn:disabled{opacity:.35; cursor:default}
button:focus-visible{outline:3px solid var(--near); outline-offset:2px}
.chips{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 10px}
.chips.inline{margin:0; flex:1; min-width:0}
.chip{display:inline-flex; align-items:center; gap:6px; font-size:.82rem; font-weight:600; padding:4px 9px 4px 6px; border-radius:99px; border:1px solid var(--edge)}
.chip i{width:18px; height:6px; border-radius:3px; display:inline-block}
.verdict{font-size:1.15rem; font-weight:700; margin:0 0 4px}
.verdict.g{color:var(--good)} .verdict.y{color:var(--near)} .verdict.o{color:var(--mid)} .verdict.r{color:var(--far)}
.detail{margin:0 0 12px; color:var(--muted)}
.summary h2{margin:0 0 4px; font-size:1.5rem; font-weight:800; font-stretch:90%}
.bigtiles{display:flex; gap:6px; margin:10px 0}
.bigtiles .tile{width:30px; height:30px; border-radius:6px}
.stats{display:flex; gap:22px; margin:6px 0 14px; color:var(--muted); font-size:.9rem}
.stats b{display:block; color:var(--ink); font-size:1.35rem; font-stretch:90%}
.copied{font-size:.85rem; color:var(--good)}
svg text{font-family:"Archivo",system-ui,sans-serif; font-weight:700; paint-order:stroke; stroke:var(--land); stroke-linejoin:round; fill:var(--ink)}
@keyframes pulse{0%{opacity:.9}100%{opacity:0}}
.pulse{animation:pulse 1.4s ease-out infinite; transform-box:fill-box; transform-origin:center}
@media (prefers-reduced-motion:reduce){ .pulse{animation:none; opacity:.5} }
.modes{position:absolute; left:12px; top:12px; display:flex; background:var(--card); border:1px solid var(--edge); border-radius:12px; padding:3px}
.modes button{appearance:none; border:0; background:transparent; color:var(--muted); font:600 .88rem/1 "Archivo",system-ui,sans-serif; padding:9px 12px; border-radius:9px; cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--ink); color:var(--card)}
.map-credit{position:absolute; right:12px; bottom:10px; color:var(--muted); background:var(--land); padding:2px 5px; border-radius:4px; font-size:.65rem}
</style>
</head>

      el:el("circle",{fill:"var(--dot)",stroke:"var(--ink)"},dotGroup)};
    const result=mode==="daily"?state.pending:practice.done;
    const color=result?(s.n===result.t?"var(--good)":s.n===result.g?"var(--far)":null):selected?.n===s.n?"var(--sel)":null;
    if(color)dot.ring=el("circle",{fill:"none",stroke:color,"stroke-width":3},dotGroup);
    if(color&&!labelled.has(s.n)){
      labelled.add(s.n);dot.label=el("text",{"font-size":14,"text-anchor":"middle",stroke:"var(--land)","stroke-width":4,fill:color},dotGroup);
      dot.label.textContent=result?s.n:"?";dot.labelOffset=result&&s.n!==result.t?20:-14;
    }
    return dot;
  });
  return {geoView,diaView,paths,dots,geoGroup,diaGroup};
}
function drawMapTransition(){
  const t=smooth(mapTransition.progress);
  const blend=smooth(Math.max(0,Math.min(1,(t-.12)/.55)));
  mapTransition.geoGroup.setAttribute("opacity",1-blend);
  mapTransition.diaGroup.setAttribute("opacity",blend);
  for(const p of mapTransition.paths){
    p.el.setAttribute("d",p.geo.map((run,r)=>run.map((a,i)=>{
      const b=p.dia[r][i];return `${i?"L":"M"}${mix(a[0],b[0],t).toFixed(2)},${mix(a[1],b[1],t).toFixed(2)}`;
    }).join("")).join(""));
    p.el.setAttribute("stroke-width",mix(p.w0,p.w1,t));
  }
  for(const d of mapTransition.dots){
    const x=mix(d.geo[0],d.dia[0],t),y=mix(d.geo[1],d.dia[1],t),r=mix(d.r0,d.r1,t);
    d.el.setAttribute("cx",x);d.el.setAttribute("cy",y);d.el.setAttribute("r",r);
    d.el.setAttribute("stroke-width",mix(1,18*mapTransition.diaView.s,t));
    if(d.ring){d.ring.setAttribute("cx",x);d.ring.setAttribute("cy",y);d.ring.setAttribute("r",Math.max(10,r+4));}
    if(d.label){d.label.setAttribute("x",x);d.label.setAttribute("y",y+d.labelOffset);}
  }
}
function finishMapTransition(){
  if(!mapTransition)return;
  cancelAnimationFrame(transitionFrame);transitionFrame=0;
  view={...(mapMode==="geo"?mapTransition.geoView:mapTransition.diaView)};
  mapTransition=null;svg.style.opacity="";$("map-transition").style.display="none";$("map-transition").replaceChildren();
  geomDirty=true;render();
}
function runMapTransition(){
  cancelAnimationFrame(transitionFrame);
  let previous=performance.now();
  const step=now=>{
    if(!mapTransition)return;
    const direction=mapMode==="dia"?1:-1;
    mapTransition.progress=Math.max(0,Math.min(1,mapTransition.progress+direction*(now-previous)/1000));previous=now;
    drawMapTransition();
    if(mapTransition.progress===(direction===1?1:0))finishMapTransition();
    else transitionFrame=requestAnimationFrame(step);
  };
  transitionFrame=requestAnimationFrame(step);
}
function setMapMode(m){
  if(m===mapMode) return;
  cancelAnimationFrame(anim);
  const previousView={...view},previousMode=mapMode;
  const u=1/view.s, x0=view.cx-W/2*u, x1=view.cx+W/2*u, y0=view.cy-H/2*u, y1=view.cy+H/2*u;
  const visibleNames=new Set(stationsForMode().filter(s=>s.x>=x0&&s.x<=x1&&s.y>=y0&&s.y<=y1).map(s=>s.n));
  mapMode=m; store.set("mtm:mapmode",m); all=allBox(m);
  const vis=stationsForMode().filter(s=>visibleNames.has(s.n));
  $("m-geo").setAttribute("aria-pressed",m==="geo"); $("m-sch").setAttribute("aria-pressed",m==="dia");
  if(mapTransition){
    measure();view={...(m==="geo"?mapTransition.geoView:mapTransition.diaView)};
    if(selected)selected=stationsNamed(selected.n)[0];
    if(reduceMotion())finishMapTransition();else runMapTransition();
    return;
  }
  const target=vis.length>=3?fitBox(bboxOf(vis.map(s=>s[key(m)])),Math.min(W,H)*0.04):fitBox(all,24);
  measure(); view=clampView(target);
  if(selected) selected=stationsNamed(selected.n)[0];
  geomDirty=true;render();
  if(reduceMotion())return;
  mapTransition={...prepareMapTransition(m==="dia"?previousView:view,m==="dia"?view:previousView),progress:previousMode==="dia"?1:0};
  svg.style.opacity="0";$("map-transition").style.display="";drawMapTransition();runMapTransition();
}
$("m-geo").onclick=()=>setMapMode("geo"); $("m-sch").onclick=()=>setMapMode("dia");

// pointers
const ptrs=new Map(); let moved=false,multi=false,pinch0=null;
svg.addEventListener("pointerdown",e=>{ const transitioning=!!mapTransition;finishMapTransition();touched=true; svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY}); cancelAnimationFrame(anim);
  if(ptrs.size===1){moved=transitioning;multi=false;} else {multi=true;pinch0=null;} svg.classList.add("drag"); hideToast(); });
svg.addEventListener("pointermove",e=>{ const p=ptrs.get(e.pointerId); if(!p) return; const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
  if(Math.hypot(p.x-p.x0,p.y-p.y0)>7) moved=true;
  if(ptrs.size===1){ if(moved){ view.cx-=dx/view.s; view.cy-=dy/view.s; clampView(view); schedule(); } }
  else if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; const r=svg.getBoundingClientRect(); const d=Math.hypot(a.x-b.x,a.y-b.y), mx=(a.x+b.x)/2-r.left, my=(a.y+b.y)/2-r.top;
    if(pinch0){ view.cx-=(mx-pinch0.mx)/view.s; view.cy-=(my-pinch0.my)/view.s; zoomAt(d/pinch0.d,mx,my); } pinch0={d,mx,my}; } });
function up(e){ const p=ptrs.get(e.pointerId); if(!p) return; ptrs.delete(e.pointerId); if(ptrs.size<2) pinch0=null;
  if(ptrs.size===0){ svg.classList.remove("drag"); if(!moved&&!multi){ const r=svg.getBoundingClientRect(); tap(e.clientX-r.left,e.clientY-r.top); } } }
svg.addEventListener("pointerup",up); svg.addEventListener("pointercancel",e=>{ptrs.delete(e.pointerId); moved=true;});
svg.addEventListener("wheel",e=>{ e.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY*(e.deltaMode?0.05:0.0022)),e.clientX-r.left,e.clientY-r.top); hideToast(); },{passive:false});
$("zin").onclick=()=>zoomAt(1.6); $("zout").onclick=()=>zoomAt(1/1.6); $("zall").onclick=()=>animateTo(fitBox(all,24));
svg.addEventListener("keydown",e=>{ finishMapTransition();const step=80/view.s,k=e.key;
  if(k==="+"||k==="=") zoomAt(1.4); else if(k==="-") zoomAt(1/1.4); else if(k==="ArrowLeft") view.cx-=step; else if(k==="ArrowRight") view.cx+=step; else if(k==="ArrowUp") view.cy-=step; else if(k==="ArrowDown") view.cy+=step; else return;
  e.preventDefault(); clampView(view); schedule(); });
function hideToast(){ $("toast").style.opacity=0; } setTimeout(hideToast,5000);

/* ---------- game ---------- */
let mode="daily",state=null,selected=null;
const DKEY="mtm2:"+TODAY;
function newDaily(){ return store.get(DKEY)||{date:TODAY,rounds:[],hint:false}; }
function saveDaily(){ if(mode==="daily") store.set(DKEY,state); }
let practice={count:0,correct:0,target:null,hint:false,done:null};
const randomName=()=>names[Math.floor(Math.random()*names.length)];
function current(){ return mode==="daily"?dailyTargets[state.rounds.length]:practice.target; }
function roundLocked(){ return mode==="daily"?(state.rounds.length>=ROUNDS||!!state.pending):!!practice.done; }
function tap(sx,sy){
  if(roundLocked()||mapTransition) return;
  const wx=view.cx+(sx-W/2)/view.s, wy=view.cy+(sy-H/2)/view.s; let best=null,bd=1e18;
  for(const s of stationsForMode()){ const d=(s.x-wx)**2+(s.y-wy)**2; if(d<bd){bd=d;best=s;} }
  const lim=26/view.s; if(!best||bd>lim*lim) return;
  selected=best; schedule(); renderPanel();
}
const grade=h=>h===0?"g":h<=2?"y":h<=5?"o":"r";
const PTS=[100,70,50,35,20,10];
function confirmGuess(){
  finishMapTransition();
  if(!selected) return; const t=current(), g=selected.n, h=hops(g,t), hint=mode==="daily"?state.hint:practice.hint;
  let pts=h<PTS.length?PTS[h]:0; if(hint) pts=Math.round(pts/2);
  const res={t,g,h,km:+kmBetween(g,t).toFixed(1),hint,pts};
  if(mode==="daily"){ state.pending=res; state.rounds.push(res); state.hint=false; saveDaily(); if(state.rounds.length===ROUNDS) recordStats(); }
  else { practice.done=res; practice.count++; if(h===0) practice.correct++; }
  revealFit(res); renderAll();
}
function revealFit(res){
  const pts=[...stationsNamed(res.t),...stationsNamed(res.g)].map(s=>[s.x,s.y]); const b=bboxOf(pts);
  const pad=mapMode==="geo"?900:450; b.minx-=pad*2.2; b.maxx+=pad*2.2; b.miny-=pad; b.maxy+=pad;
  const t=fitBox(b,50); t.s=Math.min(t.s,mapMode==="geo"?0.12:0.2); animateTo(t);
}
function nextRound(){ finishMapTransition();selected=null;
  if(mode==="daily"){ delete state.pending; saveDaily(); } else { practice.done=null; practice.hint=false; practice.target=randomName(); }
  renderAll(); }
function useHint(){ if(mode==="daily"){ state.hint=true; saveDaily(); } else practice.hint=true; renderPanel(); }
function recordStats(){ const st=store.get("mtm:stats")||{played:0,streak:0,best:0,last:null};
  if(st.last===TODAY) return; const y=new Date(today); y.setDate(y.getDate()-1);
  st.streak=st.last===dateKey(y)?st.streak+1:1; st.played++; st.best=Math.max(st.best,st.streak); st.last=TODAY; store.set("mtm:stats",st); }

function renderMarks(u){
  const gm=$("marks"),gl=$("labels"),go=$("overlay"); gm.innerHTML=""; gl.innerHTML=""; go.innerHTML="";
  const res=mode==="daily"?state.pending:practice.done;
  const label=(s,text,col,dy=-12)=>{ const t=el("text",{x:s.x,y:s.y+dy*u,"font-size":14*u,"text-anchor":"middle","stroke-width":4*u,fill:col},gl); t.textContent=text; };
  const ring=(s,col,r=9,w=3)=>el("circle",{cx:s.x,cy:s.y,r:r*u,fill:"none",stroke:col,"stroke-width":w,"vector-effect":"non-scaling-stroke"},gm);
  if(res){
    const T=stationsNamed(res.t), G=stationsNamed(res.g);
    if(res.h>0){ const a=G[0], b=T.reduce((p,q)=>Math.hypot(q.x-a.x,q.y-a.y)<Math.hypot(p.x-a.x,p.y-a.y)?q:p);
      el("line",{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:"var(--muted)","stroke-width":2,"stroke-dasharray":"5 5","vector-effect":"non-scaling-stroke"},go);
      G.forEach(s=>ring(s,"var(--far)",8,3)); label(G[0],res.g,"var(--muted)",20); }
    T.forEach(s=>{ el("circle",{cx:s.x,cy:s.y,r:7*u,fill:"var(--good)"},gm); el("circle",{cx:s.x,cy:s.y,r:14*u,fill:"none",stroke:"var(--good)","stroke-width":3,"vector-effect":"non-scaling-stroke",class:"pulse"},gm); });
    label(T[0],res.t,"var(--good)");
  } else if(selected){ stationsNamed(selected.n).forEach(s=>ring(s,"var(--sel)",10,3)); label(selected,"?","var(--ink)",-14); }
}
function chips(n,inline){ return `<div class="chips${inline?" inline":""}">${linesOf(n).map(l=>`<span class="chip"><i style="background:${lineColor(l)}"></i>${esc(LINES[l][0])}</span>`).join("")}</div>`; }
function verdictText(r){ return r.h===0?["Spot on.","g"]:[{y:"So close.",o:"Right area.",r:"Not quite."}[grade(r.h)],grade(r.h)]; }
function renderPanel(){
  const P=$("panel");
  if(mode==="daily"&&state.rounds.length>=ROUNDS&&!state.pending){ P.innerHTML=summaryHTML(); bindSummary(); return; }
  const res=mode==="daily"?state.pending:practice.done;
  if(res){ const [v,c]=verdictText(res); const last=mode==="daily"&&state.rounds.length>=ROUNDS;
    const detail=res.h===0?`You found ${esc(res.t)}.`:`You picked ${esc(res.g)}, ${res.h>=99?"a long way":`${res.h} stop${res.h>1?"s":""}`} (${res.km} km) from ${esc(res.t)}.`;
    P.innerHTML=`<p class="verdict ${c}">${v} ${mode==="daily"?`+${res.pts}`:""}</p><p class="detail">${detail}</p>${chips(res.t)}
      <div class="row"><button class="btn" id="next">${last?"See today's result":"Next station"}</button></div>`;
    $("next").onclick=nextRound; $("next").focus({preventScroll:true}); return; }
  const t=current(), hint=mode==="daily"?state.hint:practice.hint;
  P.innerHTML=`<p class="find">Find this station</p><p class="station">${esc(t)}</p>
    <div class="row"><button class="btn" id="go" ${selected?"":"disabled"}>${selected?"Confirm":"Tap a station"}</button>
    ${hint?chips(t,true):`<button class="btn ghost" id="hint">Show its lines</button>`}</div>`;
  $("go").onclick=confirmGuess; if($("hint")) $("hint").onclick=useHint;
}
const emoji=r=>({g:"🟩",y:"🟨",o:"🟧",r:"🟥"}[grade(r.h)]);
function shareText(){ const tot=state.rounds.reduce((a,r)=>a+r.pts,0); return `Mind the Map #${puzzleNo}  ${tot}/${ROUNDS*100}\n${state.rounds.map(emoji).join("")}`; }
function summaryHTML(){
  const tot=state.rounds.reduce((a,r)=>a+r.pts,0), exact=state.rounds.filter(r=>r.h===0).length, st=store.get("mtm:stats")||{played:1,streak:1};
  return `<div class="summary"><h2>Today's result</h2><p class="detail" style="margin:0">${tot} of ${ROUNDS*100} points, ${exact} of ${ROUNDS} spot on</p>
    <div class="bigtiles">${state.rounds.map(r=>`<span class="tile ${grade(r.h)}" title="${esc(r.t)}"></span>`).join("")}</div>
    <div class="stats"><div><b>${st.played}</b>played</div><div><b>${st.streak}</b>day streak</div><div><b id="cd">--:--:--</b>until the next puzzle</div></div>
    <div class="row"><button class="btn" id="share">Share result</button><button class="btn ghost" id="prac">Practise with random stations</button><span class="copied" id="copied"></span></div></div>`;
}
let cdT;
function bindSummary(){
  $("share").onclick=async()=>{ const txt=shareText(); try{ if(navigator.share&&matchMedia("(pointer:coarse)").matches){ await navigator.share({text:txt}); return; } await navigator.clipboard.writeText(txt); $("copied").textContent="Copied to clipboard"; }catch(e){ $("copied").textContent=txt.replace("\n"," "); } };
  $("prac").onclick=()=>{ mode="practice"; practice.target=randomName(); selected=null; animateTo(startView()); renderAll(); };
  const tick=()=>{ const n=new Date(),m=new Date(n); m.setHours(24,0,0,0); const s=Math.max(0,Math.floor((m-n)/1000)); const c=$("cd"); if(!c){clearInterval(cdT);return;}
    c.textContent=[s/3600|0,(s%3600)/60|0,s%60].map(v=>String(v).padStart(2,"0")).join(":"); if(s===0) location.reload(); };
  clearInterval(cdT); tick(); cdT=setInterval(tick,1000);
}
function renderTiles(){
  const T=$("tiles");
  if(mode==="practice"){ T.className="practice-count"; T.innerHTML=`Practice: ${practice.correct}/${practice.count} spot on · <a href="#" id="back" style="color:inherit">today's puzzle</a>`;
    $("back").onclick=e=>{e.preventDefault(); mode="daily"; selected=null; renderAll();}; return; }
  T.className="tiles"; let h=""; for(let i=0;i<ROUNDS;i++){ const r=state.rounds[i]; h+=`<span class="tile ${r?grade(r.h):""} ${!r&&i===state.rounds.length?"cur":""}"></span>`; } T.innerHTML=h;
}
function renderAll(){ renderTiles(); renderPanel(); schedule(); }

document.addEventListener("keydown",e=>{
  if(e.key!=="Enter"||e.repeat||e.metaKey||e.ctrlKey||e.altKey) return;
  const t=e.target; if(t&&(t.tagName==="BUTTON"||t.tagName==="A"||t.tagName==="INPUT"||t.tagName==="TEXTAREA")) return;
  const res=mode==="daily"?state.pending:practice.done;
  if(res){ e.preventDefault(); nextRound(); }
  else if(selected&&!roundLocked()){ e.preventDefault(); confirmGuess(); }
});
/* ---------- boot ---------- */
state=newDaily(); $("pnum").textContent="#"+puzzleNo;
$("m-geo").setAttribute("aria-pressed",mapMode==="geo"); $("m-sch").setAttribute("aria-pressed",mapMode==="dia");
buildMap(); orderBundles("geo"); measure(); view=clampView(startView());
if(state.pending) revealFit(state.pending);
renderAll();
new ResizeObserver(()=>{ finishMapTransition();const oW=W; measure(); if(!oW||!touched) view=clampView(startView()); geomDirty=true; schedule(); }).observe(svg);

</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js');</script>
